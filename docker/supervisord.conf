; Процессы контейнера: веб-сервер и планировщик Laravel. Supervisor — PID 1 (exec из
; entrypoint.sh): перезапускает упавший процесс и передаёт сигнал остановки обоим.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:apache]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; schedule:work раз в минуту запускает schedule:run (routes/console.php — задачи и время).
; Вывод «No scheduled commands are ready» каждую минуту в лог контейнера не пишем;
; итоги задач пишут сами команды в лог Laravel, ошибки — в stderr.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autorestart=true
startsecs=5
stopwaitsecs=60
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
